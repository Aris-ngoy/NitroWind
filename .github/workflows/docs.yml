# Mintlify deploys the live site itself (GitHub App) on push to `main`.
# This workflow only validates docs so broken nav/links cannot merge.
name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Mintlify docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Mintlify CLI
        run: npm i -g mint
      - name: Validate docs.json and MDX
        run: mint validate
      - name: Check internal links
        run: mint broken-links --check-anchors --check-redirects
