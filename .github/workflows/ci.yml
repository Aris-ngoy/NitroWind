name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - run: bun install
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test packages/nitro-wind-core packages/nitro-wind
      - name: C++ engine tests
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          clang++ -std=c++20 -I packages/nitro-wind/cpp \
            packages/nitro-wind/cpp/tests/test_engine.cpp \
            packages/nitro-wind/cpp/engine/Tokenizer.cpp \
            packages/nitro-wind/cpp/engine/Parser.cpp \
            packages/nitro-wind/cpp/engine/Theme.cpp \
            packages/nitro-wind/cpp/engine/StyleCache.cpp \
            packages/nitro-wind/cpp/engine/Engine.cpp \
            -o /tmp/nitro_wind_engine_tests
          /tmp/nitro_wind_engine_tests
      - run: bun run bench

  codegen:
    name: Nitrogen codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - run: bun install
      - name: Generate Nitro C++ bindings
        working-directory: packages/nitro-wind
        run: bunx nitrogen --logLevel="debug"
