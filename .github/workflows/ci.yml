name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - run: bun install
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test packages/nitro-wind-core packages/nitro-wind
      - name: C++ engine tests
        working-directory: packages/nitro-wind
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          # Runs this package's own test:cpp script instead of relisting its
          # .cpp files here. This step used to relist them inline and had
          # drifted out of sync with test:cpp (missing Inflate.cpp, added in
          # be8a812) and cpp/tests/CMakeLists.txt (which never drifted) — an
          # undefined-symbol link failure this step had stopped catching.
          # There is now exactly one place that lists the files this build needs.
          bun run test:cpp
      - run: bun run bench

  codegen:
    name: Nitrogen codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - run: bun install
      - name: Generate Nitro C++ bindings
        working-directory: packages/nitro-wind
        run: bunx nitrogen --logLevel="debug"
